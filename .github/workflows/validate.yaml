name: HACS Compliance

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # Repository-level checks that don't apply to this personal fork
          # (issues are off, no topics, no license file); the code checks still run.
          ignore: "issues topics license"
